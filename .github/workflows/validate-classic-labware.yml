name: Validate classic labware templates
on:
  push:
    branches: [classic-labware-reference]
  pull_request:
    paths: ['assets/classic-labware.json', 'glassware.py', 'test_glassware.py']
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r web/requirements.txt
      - name: Check editable template behavior and catalog
        run: |
          python -m unittest test_glassware -v
          node verify-engine.cjs
          node verify-glassware.cjs
      - name: Render original template contact sheet
        run: |
          python -m pip install cairosvg Pillow
          python - <<'PY'
          import base64, io
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url='examples/Classic-Labware.svg',write_to='Classic-Labware.png',output_width=900)
          image=Image.open('Classic-Labware.png').convert('RGB')
          image.thumbnail((700,1400))
          output=io.BytesIO();image.save(output,format='JPEG',quality=80)
          print('CLASSIC_PREVIEW_BASE64='+base64.b64encode(output.getvalue()).decode())
          PY
      - name: Package ready-to-open template documents
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('ErezDraw-Classic-Labware.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in ['examples/Classic-Labware.chemjson','examples/Classic-Labware.svg','examples/Glassware-and-Pilot-Equipment.chemjson','CLASSIC-LABWARE.md']:
                  z.write(name,name.split('/')[-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ErezDraw-Classic-Labware
          path: |
            ErezDraw-Classic-Labware.zip
            Classic-Labware.png
          if-no-files-found: error
          retention-days: 90
