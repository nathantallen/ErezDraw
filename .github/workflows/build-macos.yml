name: Build macOS package
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.txt
      - name: Test chemistry, native files, and drawing engine
        run: |
          python -m unittest test_macos_app test_keyboard_shortcuts test_appearance test_chemdraw_io test_chemistry test_structure_ops test_spectra test_proton_models test_file_io -v
          node verify-engine.cjs
      - name: Build, sign and launch packaged app
        run: python build_macos.py
      - name: Include installation instructions
        run: |
          cp MACOS.md dist/READ-ME-FIRST.md
          cp KEYBOARD-SHORTCUTS.md dist/KEYBOARD-SHORTCUTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: ErezDraw-macOS-AppleSilicon
          path: |
            dist/ErezDraw-macOS.zip
            dist/READ-ME-FIRST.md
            dist/KEYBOARD-SHORTCUTS.md
            build/macos-startup-check.json
          retention-days: 90
          if-no-files-found: error
